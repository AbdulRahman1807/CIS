<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIS Hardening Audit Report</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Google Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root {
            --bg-base: #0b0f19;
            --bg-surface: #151b2c;
            --bg-card: #1e2640;
            --bg-elevated: #273152;
            --border-color: #2b385c;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            
            --color-critical: #ef4444;
            --color-critical-bg: rgba(239, 68, 68, 0.15);
            --color-high: #f97316;
            --color-high-bg: rgba(249, 115, 22, 0.15);
            --color-medium: #eab308;
            --color-medium-bg: rgba(234, 179, 8, 0.15);
            --color-low: #3b82f6;
            --color-low-bg: rgba(59, 130, 246, 0.15);
            
            --color-pass: #10b981;
            --color-pass-bg: rgba(16, 185, 129, 0.12);
            --color-fail: #ef4444;
            --color-fail-bg: rgba(239, 68, 68, 0.12);
            --color-unknown: #8b5cf6;
            --color-unknown-bg: rgba(139, 92, 246, 0.12);
            
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            
            --transition-fast: 0.15s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-base);
            color: var(--text-primary);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            padding-bottom: 3rem;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-base);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--bg-elevated);
        }

        /* Utility classes */
        .flex { display: flex; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .flex-col { flex-direction: column; }
        .gap-2 { gap: 0.5rem; }
        .gap-4 { gap: 1rem; }
        .w-full { width: 100%; }
        .text-right { text-align: right; }
        .cursor-pointer { cursor: pointer; }

        /* Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in {
            animation: fadeIn 0.25s ease-out forwards;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        /* REPORT_JSON_DATA */
    </script>

    <script type="text/babel">
        const { useState, useMemo } = React;

        // Realistic fallback mock report for testing
        const mockReport = {
            meta: {
                target: "cis-misconfigured-demo",
                timestamp: new Date().toISOString(),
                transport: "docker"
            },
            summary: {
                pass: 2,
                fail: 6,
                unknown: 2
            },
            findings: [
                {
                    rule_id: "CIS-5.2.10",
                    title: "SSH root login disabled",
                    command: "sshd -T",
                    status: "FAIL",
                    evidence: "permitrootlogin yes",
                    severity_hint: "high"
                },
                {
                    rule_id: "CIS-5.2.11",
                    title: "SSH password auth disabled",
                    command: "sshd -T",
                    status: "FAIL",
                    evidence: "passwordauthentication yes",
                    severity_hint: "high"
                },
                {
                    rule_id: "CIS-5.3.1",
                    title: "Minimum password length \u226514",
                    command: "cat /etc/login.defs",
                    status: "FAIL",
                    evidence: "PASS_MIN_LEN 5",
                    severity_hint: "medium"
                },
                {
                    rule_id: "CIS-6.1.2",
                    title: "/etc/passwd ownership/perms",
                    command: "stat -c %U:%G %a /etc/passwd",
                    status: "PASS",
                    evidence: "root:root 644",
                    severity_hint: "medium"
                },
                {
                    rule_id: "CIS-6.1.3",
                    title: "/etc/shadow ownership/perms",
                    command: "stat -c %U:%G %a /etc/shadow",
                    status: "PASS",
                    evidence: "root:shadow 640",
                    severity_hint: "high"
                },
                {
                    rule_id: "CIS-6.1.10",
                    title: "No world-writable files in /etc, /usr/bin, /usr/sbin",
                    command: "find /etc /usr/bin /usr/sbin -xdev -type f -perm -0002",
                    status: "FAIL",
                    evidence: "/etc/writable_file_planted\n/usr/bin/some_writable_file",
                    severity_hint: "medium"
                },
                {
                    rule_id: "CIS-3.5.1",
                    title: "Firewall active",
                    command: "iptables -L INPUT -n",
                    status: "UNKNOWN",
                    evidence: "iptables: executable file not found",
                    severity_hint: "high"
                },
                {
                    rule_id: "CIS-2.2.4",
                    title: "Automatic security updates enabled",
                    command: "cat /etc/apt/apt.conf.d/20auto-upgrades",
                    status: "FAIL",
                    evidence: "cat: /etc/apt/apt.conf.d/20auto-upgrades: No such file or directory",
                    severity_hint: "medium"
                },
                {
                    rule_id: "CIS-5.4.1",
                    title: "No accounts with empty passwords",
                    command: "awk -F: ($2==\"\"){print $1} /etc/shadow",
                    status: "UNKNOWN",
                    evidence: "permission denied",
                    severity_hint: "critical"
                },
                {
                    rule_id: "CIS-5.2.9",
                    title: "No blanket NOPASSWD:ALL in sudoers",
                    command: "grep -r NOPASSWD /etc/sudoers /etc/sudoers.d",
                    status: "FAIL",
                    evidence: "/etc/sudoers:ALL ALL=(ALL) NOPASSWD:ALL",
                    severity_hint: "high"
                }
            ],
            fix_list: [
                {
                    priority: 1,
                    rule_id: "CIS-5.2.10",
                    category: "SSH hardening",
                    finding: "Root login over SSH is permitted (permitrootlogin yes).",
                    why_it_matters: "A leaked or brute-forced root credential grants full remote access with no separate privilege step.",
                    fix_command: "sudo sed -i 's/^PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config && sudo systemctl reload sshd",
                    evidence_ref: "CIS-5.2.10"
                },
                {
                    priority: 2,
                    rule_id: "CIS-5.2.11",
                    category: "SSH hardening",
                    finding: "Password authentication is enabled (passwordauthentication yes).",
                    why_it_matters: "Password login exposes the SSH service to automated dictionary and brute-force attacks.",
                    fix_command: "sudo sed -i 's/^PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config && sudo systemctl reload sshd",
                    evidence_ref: "CIS-5.2.11"
                },
                {
                    priority: 3,
                    rule_id: "CIS-5.2.9",
                    category: "Sudo configuration",
                    finding: "Blanket NOPASSWD wildcard found in sudoers.",
                    why_it_matters: "Allows execution of administrative commands as root without authentication, permitting easy privilege escalation.",
                    fix_command: "sudo sed -i '/NOPASSWD/d' /etc/sudoers",
                    evidence_ref: "CIS-5.2.9"
                },
                {
                    priority: 4,
                    rule_id: "CIS-5.3.1",
                    category: "Password policy",
                    finding: "Minimum password length is 5 (minimum is 14).",
                    why_it_matters: "Short passwords can be cracked in seconds using modern offline attack techniques.",
                    fix_command: "sudo sed -i 's/^PASS_MIN_LEN.*/PASS_MIN_LEN 14/' /etc/login.defs",
                    evidence_ref: "CIS-5.3.1"
                },
                {
                    priority: 5,
                    rule_id: "CIS-2.2.4",
                    category: "Updates",
                    finding: "Automatic security upgrades are not configured.",
                    why_it_matters: "Unpatched vulnerabilities are the primary entry point for automated exploits.",
                    fix_command: "echo 'APT::Periodic::Update-Package-Lists \"1\";\\nAPT::Periodic::Unattended-Upgrade \"1\";' | sudo tee /etc/apt/apt.conf.d/20auto-upgrades",
                    evidence_ref: "CIS-2.2.4"
                },
                {
                    priority: 6,
                    rule_id: "CIS-6.1.10",
                    category: "Permissions",
                    finding: "Planted world-writable file found under /etc.",
                    why_it_matters: "Allows any unprivileged user to overwrite critical configuration files and compromise the system.",
                    fix_command: "sudo chmod o-w /etc/writable_file_planted /usr/bin/some_writable_file",
                    evidence_ref: "CIS-6.1.10"
                }
            ],
            unknowns: [
                {
                    rule_id: "CIS-3.5.1",
                    title: "Firewall active",
                    command: "iptables -L INPUT -n",
                    status: "UNKNOWN",
                    evidence: "iptables: executable file not found",
                    severity_hint: "high"
                },
                {
                    rule_id: "CIS-5.4.1",
                    title: "No accounts with empty passwords",
                    command: "awk -F: ($2==\"\"){print $1} /etc/shadow",
                    status: "UNKNOWN",
                    evidence: "permission denied",
                    severity_hint: "critical"
                }
            ]
        };

        function App() {
            // Read audit report from window or fallback to mock
            const report = useMemo(() => {
                if (window.AUDIT_REPORT) {
                    return window.AUDIT_REPORT;
                }
                console.log("No dynamic report loaded, utilizing mock target data.");
                return mockReport;
            }, []);

            // Extracted values
            const findings = report.findings || [];
            const fixList = report.fix_list || [];
            const unknowns = report.unknowns || findings.filter(f => f.status === "UNKNOWN");
            const meta = report.meta || { target: "unknown", timestamp: new Date().toISOString(), transport: "unknown" };
            
            // Calculate dynamic counts if summary is missing
            const summary = useMemo(() => {
                if (report.summary) return report.summary;
                return {
                    pass: findings.filter(f => f.status === "PASS").length,
                    fail: findings.filter(f => f.status === "FAIL").length,
                    unknown: findings.filter(f => f.status === "UNKNOWN").length
                };
            }, [report.summary, findings]);

            const [statusFilter, setStatusFilter] = useState("ALL");
            const [severityFilter, setSeverityFilter] = useState("ALL");
            const [searchQuery, setSearchQuery] = useState("");
            const [expandedFindings, setExpandedFindings] = useState({});
            const [copiedFixId, setCopiedFixId] = useState(null);

            // Filter findings
            const filteredFindings = useMemo(() => {
                return findings.filter(f => {
                    const matchesStatus = statusFilter === "ALL" || f.status === statusFilter;
                    const matchesSeverity = severityFilter === "ALL" || f.severity_hint === severityFilter;
                    
                    const query = searchQuery.toLowerCase();
                    const matchesSearch = 
                        f.rule_id.toLowerCase().includes(query) ||
                        f.title.toLowerCase().includes(query) ||
                        f.command.toLowerCase().includes(query) ||
                        (f.evidence && f.evidence.toLowerCase().includes(query));

                    return matchesStatus && matchesSeverity && matchesSearch;
                });
            }, [findings, statusFilter, severityFilter, searchQuery]);

            const passPercentage = useMemo(() => {
                const total = summary.pass + summary.fail;
                if (total === 0) return 0;
                return Math.round((summary.pass / total) * 100);
            }, [summary]);

            const toggleExpandFinding = (ruleId) => {
                setExpandedFindings(prev => ({
                    ...prev,
                    [ruleId]: !prev[ruleId]
                }));
            };

            const copyToClipboard = (text, id) => {
                navigator.clipboard.writeText(text).then(() => {
                    setCopiedFixId(id);
                    setTimeout(() => setCopiedFixId(null), 2000);
                });
            };

            return (
                <div style={{ maxWidth: '1400px', margin: '0 auto', padding: '2rem 1.5rem' }}>
                    {/* Header */}
                    <header style={styles.header}>
                        <div>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem', marginBottom: '0.5rem' }}>
                                <span className="material-icons" style={{ color: 'var(--color-pass)', fontSize: '2rem' }}>security</span>
                                <h1 style={styles.headerTitle}>CIS Audit Agent Findings</h1>
                            </div>
                            <p style={styles.headerSubtitle}>
                                Automated Hardening and Compliance Report for Target Hosts
                            </p>
                        </div>
                        <div style={styles.metaBox}>
                            <div style={styles.metaRow}>
                                <span style={styles.metaLabel}>Target Container:</span>
                                <span style={styles.metaVal}>{meta.target}</span>
                            </div>
                            <div style={styles.metaRow}>
                                <span style={styles.metaLabel}>Transport Protocol:</span>
                                <span style={styles.metaVal}>{meta.transport}</span>
                            </div>
                            <div style={styles.metaRow}>
                                <span style={styles.metaLabel}>Generated On:</span>
                                <span style={styles.metaVal}>{new Date(meta.timestamp).toLocaleString()}</span>
                            </div>
                        </div>
                    </header>

                    {/* Summary cards */}
                    <section style={styles.summaryGrid}>
                        <div style={styles.summaryCard}>
                            <span style={styles.summaryCardLabel}>Compliance Score</span>
                            <div style={{ display: 'flex', alignItems: 'baseline', gap: '0.5rem', margin: '0.5rem 0' }}>
                                <span style={{ ...styles.summaryCardVal, color: passPercentage > 75 ? 'var(--color-pass)' : (passPercentage > 40 ? 'var(--color-medium)' : 'var(--color-critical)') }}>
                                    {passPercentage}%
                                </span>
                            </div>
                            <div style={styles.progressBarBg}>
                                <div style={{ ...styles.progressBarFill, width: `${passPercentage}%`, backgroundColor: passPercentage > 75 ? 'var(--color-pass)' : (passPercentage > 40 ? 'var(--color-medium)' : 'var(--color-critical)') }} />
                            </div>
                        </div>

                        <div style={styles.summaryCard}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                <span style={styles.summaryCardLabel}>Checks Failed</span>
                                <span className="material-icons" style={{ color: 'var(--color-fail)', fontSize: '1.25rem' }}>error_outline</span>
                            </div>
                            <span style={{ ...styles.summaryCardVal, color: 'var(--color-fail)' }}>{summary.fail}</span>
                            <p style={styles.summaryCardFoot}>Needs immediate remediation</p>
                        </div>

                        <div style={styles.summaryCard}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                <span style={styles.summaryCardLabel}>Checks Passed</span>
                                <span className="material-icons" style={{ color: 'var(--color-pass)', fontSize: '1.25rem' }}>check_circle_outline</span>
                            </div>
                            <span style={{ ...styles.summaryCardVal, color: 'var(--color-pass)' }}>{summary.pass}</span>
                            <p style={styles.summaryCardFoot}>Hardened parameters secure</p>
                        </div>

                        <div style={styles.summaryCard}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                <span style={styles.summaryCardLabel}>Checks Unknown</span>
                                <span className="material-icons" style={{ color: 'var(--color-unknown)', fontSize: '1.25rem' }}>help_outline</span>
                            </div>
                            <span style={{ ...styles.summaryCardVal, color: 'var(--color-unknown)' }}>{summary.unknown}</span>
                            <p style={styles.summaryCardFoot}>Lacking environment permissions</p>
                        </div>
                    </section>

                    {/* Main Layout Area */}
                    <div style={styles.mainGrid}>
                        {/* Left column: Findings & Filter */}
                        <div style={styles.leftColumn}>
                            {/* Filter Bar */}
                            <div style={styles.filterBar}>
                                <div style={styles.searchContainer}>
                                    <span className="material-icons" style={styles.searchIcon}>search</span>
                                    <input 
                                        type="text" 
                                        placeholder="Search findings, commands or evidence..." 
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        style={styles.searchInput}
                                    />
                                </div>
                                <div style={styles.filterGroups}>
                                    <div style={{ display: 'flex', flexDirection: 'column', gap: '0.25rem', flex: 1 }}>
                                        <label style={styles.filterLabel}>Verdict Filter</label>
                                        <div style={styles.btnGroup}>
                                            {["ALL", "FAIL", "PASS", "UNKNOWN"].map(status => (
                                                <button 
                                                    key={status}
                                                    onClick={() => setStatusFilter(status)}
                                                    style={{
                                                        ...styles.filterBtn,
                                                        ...(statusFilter === status ? styles.filterBtnActive : {})
                                                    }}
                                                >
                                                    {status}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                    <div style={{ display: 'flex', flexDirection: 'column', gap: '0.25rem', flex: 1 }}>
                                        <label style={styles.filterLabel}>Severity Filter</label>
                                        <div style={styles.btnGroup}>
                                            {["ALL", "critical", "high", "medium", "low"].map(sev => (
                                                <button 
                                                    key={sev}
                                                    onClick={() => setSeverityFilter(sev)}
                                                    style={{
                                                        ...styles.filterBtn,
                                                        ...(severityFilter === sev ? styles.filterBtnActive : {})
                                                    }}
                                                >
                                                    {sev.charAt(0).toUpperCase() + sev.slice(1)}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Findings List */}
                            <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                    <h2 style={styles.sectionTitle}>Audit Checks ({filteredFindings.length})</h2>
                                    {filteredFindings.length < findings.length && (
                                        <span style={styles.resetText} onClick={() => { setStatusFilter("ALL"); setSeverityFilter("ALL"); setSearchQuery(""); }}>
                                            Reset Filters
                                        </span>
                                    )}
                                </div>
                                
                                {filteredFindings.length === 0 ? (
                                    <div style={styles.emptyState}>
                                        <span className="material-icons" style={{ fontSize: '3rem', color: 'var(--text-muted)', marginBottom: '1rem' }}>search_off</span>
                                        <p style={{ color: 'var(--text-secondary)' }}>No matching audit checks found.</p>
                                    </div>
                                ) : (
                                    filteredFindings.map((finding) => {
                                        const isExpanded = !!expandedFindings[finding.rule_id];
                                        return (
                                            <div key={finding.rule_id} style={styles.findingCard} className="animate-fade-in">
                                                {/* Header Row */}
                                                <div 
                                                    style={styles.findingHeader} 
                                                    className="cursor-pointer"
                                                    onClick={() => toggleExpandFinding(finding.rule_id)}
                                                >
                                                    <div style={{ display: 'flex', flexDirection: 'column', gap: '0.35rem', flex: 1 }}>
                                                        <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', flexWrap: 'wrap' }}>
                                                            <span style={styles.ruleIdBadge}>{finding.rule_id}</span>
                                                            <span style={{ ...styles.severityBadge, ...styles[`severity_${finding.severity_hint}`] }}>
                                                                {finding.severity_hint}
                                                            </span>
                                                        </div>
                                                        <h3 style={styles.findingTitle}>{finding.title}</h3>
                                                    </div>
                                                    <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem' }}>
                                                        <span style={{ ...styles.statusBadge, ...styles[`status_${finding.status}`] }}>
                                                            {finding.status}
                                                        </span>
                                                        <span className="material-icons" style={{ color: 'var(--text-secondary)', transition: 'transform var(--transition-fast)', transform: isExpanded ? 'rotate(180deg)' : 'none' }}>
                                                            expand_more
                                                        </span>
                                                    </div>
                                                </div>

                                                {/* Expandable Details */}
                                                {isExpanded && (
                                                    <div style={styles.findingDetails}>
                                                        <div style={styles.detailRow}>
                                                            <span style={styles.detailLabel}>Audit Command</span>
                                                            <code style={styles.codeBlock}>{finding.command}</code>
                                                        </div>
                                                        <div style={styles.detailRow}>
                                                            <span style={styles.detailLabel}>
                                                                {finding.status === "UNKNOWN" ? "Reason / Stderr" : "Evidence Output"}
                                                            </span>
                                                            <pre style={{ 
                                                                ...styles.preBlock, 
                                                                borderColor: finding.status === "FAIL" ? 'rgba(239, 68, 68, 0.4)' : (finding.status === "PASS" ? 'rgba(16, 185, 129, 0.4)' : 'rgba(139, 92, 246, 0.4)')
                                                            }}>
                                                                {finding.evidence || "No command output captured."}
                                                            </pre>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })
                                )}
                            </div>
                        </div>

                        {/* Right column: Prioritized Fix List */}
                        <div style={styles.rightColumn}>
                            <div style={styles.stickySection}>
                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.25rem' }}>
                                    <div>
                                        <h2 style={styles.sectionTitle}>Remediation Fix List</h2>
                                        <p style={{ color: 'var(--text-secondary)', fontSize: '0.870rem' }}>Ordered by priority and severity</p>
                                    </div>
                                    <span style={styles.badgeCount}>{fixList.length} Items</span>
                                </div>

                                {fixList.length === 0 ? (
                                    <div style={styles.emptyFixState}>
                                        <span className="material-icons" style={{ fontSize: '3.5rem', color: 'var(--color-pass)', marginBottom: '1rem' }}>check_circle</span>
                                        <h3 style={{ color: 'var(--text-primary)', marginBottom: '0.25rem' }}>No Remediations Required</h3>
                                        <p style={{ color: 'var(--text-secondary)', fontSize: '0.875rem' }}>All audited hardening checks have passed successfully!</p>
                                    </div>
                                ) : (
                                    <div style={styles.fixListContainer}>
                                        {fixList.map((fix) => {
                                            const findingRef = findings.find(f => f.rule_id === fix.rule_id);
                                            const severity = findingRef ? findingRef.severity_hint : "high";
                                            const isCopied = copiedFixId === fix.rule_id;
                                            
                                            return (
                                                <div key={fix.rule_id} style={styles.fixCard}>
                                                    {/* Header */}
                                                    <div style={styles.fixCardHeader}>
                                                        <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                                                            <span style={{ ...styles.priorityNumber, ...styles[`severity_${severity}`] }}>
                                                                #{fix.priority}
                                                            </span>
                                                            <span style={styles.fixCategory}>{fix.category}</span>
                                                        </div>
                                                        <span style={styles.fixRuleId}>{fix.rule_id}</span>
                                                    </div>
                                                    
                                                    {/* Finding and description */}
                                                    <div style={styles.fixBody}>
                                                        <p style={styles.fixFindingText}>
                                                            <strong>Finding:</strong> {fix.finding}
                                                        </p>
                                                        <p style={styles.fixWhyText}>
                                                            <strong>Why it matters:</strong> {fix.why_it_matters}
                                                        </p>
                                                    </div>

                                                    {/* Command Copy Box */}
                                                    <div style={styles.copyCommandContainer}>
                                                        <div style={styles.copyCommandCode}>
